name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      auth_server_released: ${{ steps.release.outputs['packages/auth-server--release_created'] }}
      auth_server_tag_name: ${{ steps.release.outputs['packages/auth-server--tag_name'] }}
      admin_console_released: ${{ steps.release.outputs['packages/admin-console--release_created'] }}
      admin_console_tag_name: ${{ steps.release.outputs['packages/admin-console--tag_name'] }}
      shared_released: ${{ steps.release.outputs['packages/shared--release_created'] }}
      sdk_typescript_released: ${{ steps.release.outputs['packages/sdks/typescript--release_created'] }}
      sdk_auth_ui_released: ${{ steps.release.outputs['packages/sdks/auth-ui--release_created'] }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-auth-server:
    needs: release-please
    if: ${{ needs.release-please.outputs.auth_server_released == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.auth_server_tag_name }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build shared dependency
        run: bun run --filter '@supauth/shared' build

      - name: Build auth-server
        working-directory: packages/auth-server
        run: bun run build

      - name: Package auth-server artifacts
        run: |
          set -euo pipefail
          rm -rf release-assets
          mkdir -p release-assets
          cp packages/auth-server/dist/index.js release-assets/auth-server-index.js
          cp packages/auth-server/dist/supacloud-function/supacloud-function.js release-assets/supacloud-function.js
          tar -czf release-assets/auth-server-dist.tar.gz -C packages/auth-server/dist .
          (cd release-assets && sha256sum * > SHA256SUMS)

      - name: Upload auth-server artifact to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.auth_server_tag_name }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber

  publish-admin-console:
    needs: release-please
    if: ${{ needs.release-please.outputs.admin_console_released == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.admin_console_tag_name }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build shared dependency
        run: bun run --filter '@supauth/shared' build

      - name: Build admin-console static site
        working-directory: packages/admin-console
        run: bun run build

      - name: Package admin-console build artifact
        run: |
          mkdir -p release-assets
          tar -czf release-assets/admin-console-build.tar.gz -C packages/admin-console/build .

      - name: Upload admin-console artifact to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.admin_console_tag_name }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber

  publish-npm:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build SDK packages
        run: |
          bun run --filter '@supauth/shared' build
          bun run --filter '@supauth/sdk-typescript' build
          bun run --filter '@supauth/sdk-auth-ui' build

      - name: Prepare npm package metadata
        run: bun run scripts/prepare-npm-packages.ts --write

      - name: Verify npm package contents
        run: |
          set -e
          for pkg_dir in packages/shared packages/sdks/typescript packages/sdks/auth-ui; do
            echo "Packing $pkg_dir"
            (cd "$pkg_dir" && bunx npm pack --dry-run)
          done

      - name: Check npm bootstrap status
        id: npm-bootstrap
        run: |
          set -e
          MISSING=0
          for pkg_dir in packages/shared packages/sdks/typescript packages/sdks/auth-ui; do
            NAME=$(node -p "require('./$pkg_dir/package.json').name")
            if npm view "$NAME" version >/dev/null 2>&1; then
              echo "$NAME already exists on npm"
            else
              echo "::notice::$NAME does not exist on npm yet. First publish must be bootstrapped manually from a maintainer npm session."
              MISSING=1
            fi
          done

          if [ "$MISSING" -eq 1 ]; then
            echo "npm_bootstrapped=false" >> "$GITHUB_OUTPUT"
          else
            echo "npm_bootstrapped=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish changed SDK packages to npm
        if: ${{ steps.npm-bootstrap.outputs.npm_bootstrapped == 'true' }}
        run: |
          set -e
          PUBLISH_FAILED=0
          for pkg_dir in packages/shared packages/sdks/typescript packages/sdks/auth-ui; do
            NAME=$(node -p "require('./$pkg_dir/package.json').name")
            LOCAL_VER=$(node -p "require('./$pkg_dir/package.json').version")
            NPM_EXISTS=$(npm view "$NAME@$LOCAL_VER" version 2>/dev/null || echo "")

            if [ -z "$NPM_EXISTS" ]; then
              echo "Publishing $NAME@$LOCAL_VER"
              if ! (cd "$pkg_dir" && bunx npm publish --provenance --access public); then
                echo "::error::Publish failed for $NAME"
                PUBLISH_FAILED=1
              fi
            else
              echo "$NAME@$LOCAL_VER already exists on npm, skipping"
            fi
          done

          if [ "$PUBLISH_FAILED" -eq 1 ]; then
            exit 1
          fi
