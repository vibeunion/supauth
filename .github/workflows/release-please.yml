name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: NPM package release tag to publish
        required: false
        type: string

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: write

jobs:
  release-please:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_tag == '') }}
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-npm:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate release tag
        id: release-package
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            authorization-core-v*) PACKAGE_DIR=packages/authorization-core ;;
            authorization-postgres-v*) PACKAGE_DIR=packages/authorization-postgres ;;
            authorization-conformance-v*) PACKAGE_DIR=packages/authorization-conformance ;;
            shared-v*) PACKAGE_DIR=packages/shared ;;
            sdk-typescript-v*) PACKAGE_DIR=packages/sdks/typescript ;;
            sdk-auth-ui-v*) PACKAGE_DIR=packages/sdks/auth-ui ;;
            *)
              echo "::error::Unsupported npm release tag: $RELEASE_TAG"
              exit 1
              ;;
          esac
          echo "package_dir=$PACKAGE_DIR" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build SDK packages
        run: |
          bun run --filter '@supauth/authorization-core' build
          bun run --filter '@supauth/authorization-postgres' build
          bun run --filter '@supauth/authorization-conformance' build
          bun run --filter '@supauth/shared' build
          bun run --filter '@supauth/sdk-typescript' build
          bun run --filter '@supauth/sdk-auth-ui' build

      - name: Prepare npm package metadata
        run: bun run scripts/prepare-npm-packages.ts --write

      - name: Verify npm package contents
        run: |
          set -e
          for pkg_dir in packages/authorization-core packages/authorization-postgres packages/authorization-conformance packages/shared packages/sdks/typescript packages/sdks/auth-ui; do
            echo "Packing $pkg_dir"
            (cd "$pkg_dir" && bunx npm pack --dry-run)
          done

      - name: Check npm bootstrap status
        id: npm-bootstrap
        run: |
          set -euo pipefail
          PACKAGE_DIR="${{ steps.release-package.outputs.package_dir }}"
          NAME=$(node -p "require('./$PACKAGE_DIR/package.json').name")
          if npm view "$NAME" version >/dev/null 2>&1; then
            echo "$NAME already exists on npm"
            echo "npm_bootstrapped=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$NAME does not exist on npm yet. Bootstrap only this package manually from a maintainer npm session."
            echo "npm_bootstrapped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish tagged npm package
        if: ${{ steps.npm-bootstrap.outputs.npm_bootstrapped == 'true' }}
        run: |
          set -euo pipefail
          PACKAGE_DIR="${{ steps.release-package.outputs.package_dir }}"
          NAME=$(node -p "require('./$PACKAGE_DIR/package.json').name")
          LOCAL_VER=$(node -p "require('./$PACKAGE_DIR/package.json').version")
          NPM_EXISTS=$(npm view "$NAME@$LOCAL_VER" version 2>/dev/null || echo "")
          if [ -z "$NPM_EXISTS" ]; then
            echo "Publishing $NAME@$LOCAL_VER"
            (cd "$PACKAGE_DIR" && bunx npm publish --provenance --access public)
          else
            echo "$NAME@$LOCAL_VER already exists on npm, skipping"
          fi
