name: Temporary PR lockfile repair

on:
  push:
    branches: [codex/authorization-permission-catalog]
    paths: [.github/workflows/pr-review-lockfile-repair.yml]

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'vibeunion/supauth' && github.ref == 'refs/heads/codex/authorization-permission-catalog'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - name: Add only the already-resolved root dependency
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          manifest = json.loads(Path('package.json').read_text())
          assert manifest['devDependencies']['postgres'] == '3.4.9'
          lock = Path('bun.lock')
          before = lock.read_bytes()
          blob = hashlib.sha1(b'blob ' + str(len(before)).encode() + b'\0' + before).hexdigest()
          assert blob == '366ecf44da3a82d0b53377d7bd89e46dcbcecea4', 'Lockfile changed; stop rather than overwrite concurrent edits'
          anchor = b'        "playwright": "1.63.0",\n        "typescript": "^5.8.0",'
          assert before.count(anchor) == 1
          after = before.replace(anchor, b'        "playwright": "1.63.0",\n        "postgres": "3.4.9",\n        "typescript": "^5.8.0",', 1)
          lock.write_bytes(after)
          PY
          git diff --check
          test "$(git diff --numstat)" = $'1\t0\tbun.lock'
          git diff -- bun.lock
      - name: Commit the scoped lockfile repair to the same PR branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- bun.lock
          git commit -m 'fix(ci): synchronize root postgres dependency in bun lockfile'
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$auth_header" push origin HEAD:refs/heads/codex/authorization-permission-catalog
