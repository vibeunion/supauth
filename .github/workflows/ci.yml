name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Type check and test
        run: bun run check

  package-auth-ui:
    name: Package Auth UI SDK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: check

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build SDK packages
        run: |
          bun run --filter '@supaoauth/shared' build
          bun run --filter '@supaoauth/sdk-typescript' build
          bun run --filter '@supaoauth/sdk-auth-ui' build

      - name: Prepare npm package metadata
        run: node .github/scripts/prepare-auth-ui-npm-package.mjs --write

      - name: Verify npm package contents
        run: |
          set -e
          for pkg_dir in packages/shared packages/sdks/typescript packages/sdks/auth-ui; do
            echo "Packing $pkg_dir"
            (cd "$pkg_dir" && bunx npm pack --dry-run)
          done
