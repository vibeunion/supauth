name: Apply Code Quality Fixes

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    name: Apply deterministic fixes
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/fix-code-quality-findings'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply reviewed code quality fixes
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          def remove_once(path: str, snippet: str) -> None:
              replace_once(path, snippet, '')

          i18n = 'packages/admin-console/src/lib/i18n.js'
          remove_once(
              i18n,
              '  "webhooks.createFailed": "Failed to create webhook. Please check the URL and selected events.",\n',
          )
          remove_once(
              i18n,
              '  "webhooks.createFailed": "创建 Webhook 失败，请检查 URL 和所选事件。",\n',
          )
          remove_once(
              i18n,
              '  "Back to Applications": "返回应用",\n'
              '  "but runtime is currently": "但运行时当前为",\n'
              '  Password: "密码",\n'
              '  "Magic Link": "魔法链接",\n'
              '  "Phone OTP": "手机验证码",\n',
          )

          replace_once(
              'packages/admin-console/src/lib/providers/auth.ts',
              '    if (runtimeSsoConfigPromise === pendingConfig) runtimeSsoConfigPromise = null;\n',
              '    // 此处刻意比较 Promise 身份；await 会比较结果值并破坏过期请求保护。\n'
              '    if (Object.is(runtimeSsoConfigPromise, pendingConfig)) runtimeSsoConfigPromise = null;\n',
          )

          replace_once(
              'packages/sdks/typescript/src/__tests__/sdk-methods.test.ts',
              "import { describe, it, expect, beforeEach, mock } from 'bun:test';\n",
              "import { describe, it, expect, beforeEach } from 'bun:test';\n",
          )
          replace_once(
              'packages/sdks/typescript/src/__tests__/sdk.test.ts',
              "import { describe, it, expect, mock, beforeEach } from 'bun:test';\n",
              "import { describe, it, expect, beforeEach } from 'bun:test';\n",
          )

          remove_once(
              'packages/auth-server/src/routes/sign-in-experience.ts',
              "function runtimeInternalUrl(path: string) {\n"
              "  const base = config.oauthRuntimeInternalUrl.replace(/\\/$/, '');\n"
              "  const normalizedPath = path.startsWith('/') ? path : `/${path}`;\n"
              "  return `${base}${normalizedPath}`;\n"
              "}\n\n",
          )
          replace_once(
              'packages/auth-server/src/routes/admin-tools.ts',
              "import { Elysia, t } from 'elysia';\n",
              "import { Elysia } from 'elysia';\n",
          )
          replace_once(
              'packages/auth-server/src/routes/compatibility.ts',
              "import { Elysia, t } from 'elysia';\n",
              "import { Elysia } from 'elysia';\n",
          )
          replace_once(
              'packages/auth-server/src/repositories/enterprise-sso.ts',
              "import { enterpriseSSOConfig, connectors } from '../db/schema.js';\n",
              "import { enterpriseSSOConfig } from '../db/schema.js';\n",
          )
          replace_once(
              'packages/auth-server/src/repositories/bindings.ts',
              "import { eq, and } from 'drizzle-orm';\n",
              "import { eq } from 'drizzle-orm';\n",
          )
          replace_once(
              'packages/auth-server/src/compatibility/rls-migration.ts',
              '  let wrapperUsing = policy.qual;\n'
              '  let wrapperWithCheck = policy.with_check;\n',
              '  let wrapperUsing: string;\n'
              '  let wrapperWithCheck = policy.with_check;\n',
          )
          replace_once(
              'packages/auth-server/src/__tests__/hosted-authorize-page.test.ts',
              "      expect(body).toContain('hostedAuth.authenticatedFetch(`${apiBase}${path}`, {');\n",
              "      expect(body).toContain(`hostedAuth.authenticatedFetch(\\`\\${apiBase}\\${path}\\`, {`);\n",
          )
          PY

          git rm .github/workflows/code-quality-export.yml
          git diff --check
          git status --short

      - name: Commit fixes to the pull request branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/admin-console/src/lib/i18n.js \
            packages/admin-console/src/lib/providers/auth.ts \
            packages/sdks/typescript/src/__tests__/sdk-methods.test.ts \
            packages/sdks/typescript/src/__tests__/sdk.test.ts \
            packages/auth-server/src/routes/sign-in-experience.ts \
            packages/auth-server/src/routes/admin-tools.ts \
            packages/auth-server/src/routes/compatibility.ts \
            packages/auth-server/src/repositories/enterprise-sso.ts \
            packages/auth-server/src/repositories/bindings.ts \
            packages/auth-server/src/compatibility/rls-migration.ts \
            packages/auth-server/src/__tests__/hosted-authorize-page.test.ts
          git diff --cached --check
          git commit -m "fix: resolve code quality findings"
          git push origin "HEAD:${{ github.head_ref }}"
