name: PR 116 strict regression repair
on:
  push:
    branches: [codex/authorization-permission-catalog]
    paths: [.github/workflows/pr116-check-diagnostics.yml]
permissions:
  contents: read
jobs:
  repair:
    if: github.repository == 'vibeunion/supauth' && github.ref == 'refs/heads/codex/authorization-permission-catalog'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Use invalid domain values without disabling type checking
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('packages/sdks/typescript/src/__tests__/domain-contracts.test.ts')
          text = path.read_text()
          for method in ['createApplication', 'updateApplication']:
              call = "client.createApplication({ redirect_uris: [42] })" if method == 'createApplication' else "client.updateApplication('app-1', { redirect_uris: [42] })"
              lines = text.splitlines(keepends=True)
              matched = [i for i, line in enumerate(lines) if call in line]
              if len(matched) != 1:
                  raise SystemExit('Fixture changed; refusing speculative edits')
              i = matched[0]
              if i == 0 or '@ts-expect-error Exercise untyped input at the public SDK boundary.' not in lines[i - 1]:
                  raise SystemExit('Expected temporary suppression not found')
              lines[i] = lines[i].replace('redirect_uris: [42]', 'redirect_uris: []')
              del lines[i - 1]
              text = ''.join(lines)
          path.write_text(text)
          PY
          git diff --check
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Verify strict gates and SDK regressions
        run: |
          bun run check:type-safety
          bun run --filter '@supauth/sdk-typescript' test
      - name: Commit only the verified regression adjustment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch origin codex/authorization-permission-catalog
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/sdks/typescript/src/__tests__/domain-contracts.test.ts
          git commit -m 'test(sdk): exercise invalid application data without type suppressions'
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/codex/authorization-permission-catalog
