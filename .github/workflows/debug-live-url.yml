name: Debug Live URL Host
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: [self-hosted, supauth-live]
    steps:
      - name: Show URL hosts
        env:
          A: ${{ secrets.LIVE_OAUTH_RUNTIME_URL }}
          B: ${{ secrets.LIVE_MANAGEMENT_URL }}
          C: ${{ secrets.LIVE_SUPABASE_FULLSTACK_URL }}
          D: ${{ secrets.LIVE_OAUTH21_REDIRECT_URI }}
        run: |
          bun -e '
            for (const [k,v] of Object.entries({LIVE_OAUTH_RUNTIME_URL:process.env.A,LIVE_MANAGEMENT_URL:process.env.B,LIVE_SUPABASE_FULLSTACK_URL:process.env.C,LIVE_OAUTH21_REDIRECT_URI:process.env.D})) {
              if (!v) { console.log(k, ": (unset)"); continue; }
              try { const u = new URL(v.trim()); console.log(k, "host:", u.host); } catch { console.log(k, ": (invalid)"); }
            }
          '
