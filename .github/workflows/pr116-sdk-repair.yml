name: PR 116 SDK contract repair

on:
  push:
    branches: [codex/authorization-permission-catalog]
    paths: [.github/workflows/pr116-sdk-repair.yml]

permissions:
  contents: read

jobs:
  repair:
    if: github.repository == 'vibeunion/supauth' && github.ref == 'refs/heads/codex/authorization-permission-catalog'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Apply exact, guarded changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('packages/sdks/typescript/src/index.ts')
          text = source.read_text()
          replacements = [
              ("    const body = decodeSchema(sdkEndpoints.createApplication.input, { body: data }).body;\n    return this.endpointJson(sdkEndpoints.createApplication, { body });",
               "    try {\n      const body = decodeSchema(sdkEndpoints.createApplication.input, { body: data }).body;\n      return this.endpointJson(sdkEndpoints.createApplication, { body });\n    } catch {\n      throw new SupaOAuthRequestContractError();\n    }"),
              ("    const body = decodeSchema(sdkEndpoints.updateApplication.input, { params: { appId }, body: data }).body;\n    return this.endpointJson(sdkEndpoints.updateApplication, { params: { appId }, body });",
               "    try {\n      const body = decodeSchema(sdkEndpoints.updateApplication.input, { params: { appId }, body: data }).body;\n      return this.endpointJson(sdkEndpoints.updateApplication, { params: { appId }, body });\n    } catch {\n      throw new SupaOAuthRequestContractError();\n    }")
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit('Source changed; refusing a speculative replacement')
              text = text.replace(old, new, 1)
          tests = Path('packages/sdks/typescript/src/__tests__/domain-contracts.test.ts')
          test_text = tests.read_text()
          old = "        const path = new URL(String(url)).pathname;\n        expect(init?.method).toBe(contract.method);"
          new = "        const request = new Request(url, init);\n        const path = new URL(request.url).pathname;\n        expect(request.method).toBe(contract.method);"
          if test_text.count(old) != 1:
              raise SystemExit('Contract test changed; refusing a speculative replacement')
          test_text = test_text.replace(old, new, 1)
          marker = "redacts early application schema failures without calling transport"
          if marker in test_text:
              raise SystemExit('Regression already exists; refusing duplicate test')
          test_text += '''
          it('redacts early application schema failures without calling transport', () => {
            const fetcher = mock(async () => Response.json({}));
            const client = new SupaOAuthClient({ baseUrl: 'https://auth.example.test', fetch: fetcher });
            const invalidCalls = [
              // @ts-expect-error Exercise untyped input at the public SDK boundary.
              () => client.createApplication({ redirect_uris: [42] }),
              // @ts-expect-error Exercise untyped input at the public SDK boundary.
              () => client.updateApplication('app-1', { redirect_uris: [42] }),
            ];
            for (const invoke of invalidCalls) {
              expect(invoke).toThrow(SupaOAuthRequestContractError);
              try {
                invoke();
              } catch (error) {
                expect(error).toBeInstanceOf(SupaOAuthRequestContractError);
                if (error instanceof Error) {
                  expect(error.message).toBe(new SupaOAuthRequestContractError().message);
                  expect(error.cause).toBeUndefined();
                }
              }
            }
            expect(fetcher).not.toHaveBeenCalled();
          });
          '''
          source.write_text(text)
          tests.write_text(test_text)
          PY
          git diff --check
      - name: Install existing dependency graph
        run: bun install --frozen-lockfile
      - name: Validate shared declarations and SDK tests
        run: |
          bun run --filter '@supauth/shared' build
          bun run --filter '@supauth/sdk-typescript' test
          bun run --filter '@supauth/sdk-typescript' typecheck
      - name: Commit only validated source and test repairs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch origin codex/authorization-permission-catalog
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/sdks/typescript/src/index.ts packages/sdks/typescript/src/__tests__/domain-contracts.test.ts
          git commit -m 'fix(sdk): preserve request error boundary and validate effective HTTP methods'
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/codex/authorization-permission-catalog
