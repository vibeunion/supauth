name: CNB Issue Discovery

on:
  push:
    branches:
      - agent/cnb-issue-discovery
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read and encrypt open CNB issues
        env:
          CNB_TOKEN: ${{ secrets.ZHDS || secrets.CNB_TOKEN || secrets.CNB_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CNB_TOKEN:-}" ]]; then
            echo "CNB_TOKEN_MISSING=1"
            exit 2
          fi

          status="$({ curl --silent --show-error \
            --output issues.json \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CNB_TOKEN}" \
            --header 'Accept: application/vnd.cnb.api+json' \
            'https://api.cnb.cool/aizhuliren/xgic/supauth/-/issues?state=open&page=1&page_size=100&order_by=created_at'; } 2>curl-error.log)"

          if [[ "${status}" != "200" ]]; then
            echo "CNB_API_HTTP_STATUS=${status}"
            sed -n '1,5p' curl-error.log
            exit 3
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          issues = json.loads(Path('issues.json').read_text(encoding='utf-8'))
          if not isinstance(issues, list):
              raise SystemExit('CNB_API_RESPONSE_NOT_LIST=1')
          print(f'CNB_OPEN_ISSUES_COUNT={len(issues)}')
          PY

          cat > public-cert.pem <<'PEM'
          -----BEGIN CERTIFICATE-----
          MIIEUzCCArugAwIBAgIUBumTcyb/VIbO6oyFFRXU2aoRrrcwDQYJKoZIhvcNAQEL
