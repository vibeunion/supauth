<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SupaOAuth Change Password</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #18202f;
      --muted: #647084;
      --line: #d8dee8;
      --panel: #ffffff;
      --bg: #f4f7fb;
      --brand: #13736f;
      --brand-dark: #0d5855;
      --danger: #b42318;
      --success: #067647;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        linear-gradient(180deg, rgba(255,255,255,.72), rgba(244,247,251,.94)),
        radial-gradient(circle at 20% 0%, rgba(19,115,111,.18), transparent 35%),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    body.has-bg {
      background-position: center;
      background-size: cover;
    }

    body.has-bg::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.72);
    }

    main {
      position: relative;
      width: min(100%, 460px);
    }

    .brand { margin-bottom: 18px; }

    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      background: var(--ink);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 800;
      letter-spacing: 0;
    }

    .logo {
      display: none;
      max-width: 180px;
      max-height: 72px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 16px 0 6px;
      font-size: 28px;
      line-height: 1.18;
      letter-spacing: 0;
    }

    .lead {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }

    .panel {
      margin-top: 22px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 18px 48px rgba(17, 24, 39, .08);
      padding: 22px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #334155;
      font-size: 13px;
      font-weight: 650;
    }

    input {
      width: 100%;
      height: 44px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      padding: 0 12px;
      color: var(--ink);
      font-size: 15px;
      outline: none;
      background: #fff;
    }

    input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(19, 115, 111, .14);
    }

    .field + .field { margin-top: 16px; }

    button {
      border: 0;
      border-radius: 7px;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }

    .primary {
      width: 100%;
      height: 44px;
      margin-top: 20px;
      color: #fff;
      background: var(--brand);
    }

    .primary:hover { background: var(--brand-dark); }
    .primary:disabled { cursor: not-allowed; opacity: .62; }

    .message {
      display: none;
      margin-top: 14px;
      font-size: 14px;
      line-height: 1.55;
    }

    .message.active { display: block; }
    .message.error { color: var(--danger); }
    .message.success { color: var(--success); }
    .message.muted { color: var(--muted); }

    .password-hint {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .footer {
      margin-top: 18px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .link {
      color: var(--brand-dark);
      text-decoration: none;
      font-weight: 650;
    }

    .link:hover { text-decoration: underline; }
  </style>
  <style id="custom-style"></style>
  <script data-hosted-entry="public-api-base"></script>
</head>
<body>
  <main>
    <section id="brand" class="brand" aria-label="SupaOAuth">
      <img id="logo" class="logo" alt="">
      <div id="brand-mark" class="brand-mark">SA</div>
      <h1 id="page-title">修改密码</h1>
      <p class="lead">使用当前密码验证身份，然后设置一个新的登录密码。</p>
    </section>

    <section class="panel">
      <form id="password-form" novalidate>
        <div class="field">
          <label for="email">登录邮箱</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="current-password">当前密码</label>
          <input id="current-password" name="current_password" type="password" autocomplete="current-password" required>
        </div>
        <div class="field">
          <label for="new-password">新密码</label>
          <input id="new-password" name="new_password" type="password" autocomplete="new-password" aria-describedby="password-policy-hint" required>
          <p id="password-policy-hint" class="password-hint"></p>
        </div>
        <div class="field">
          <label for="confirm-password">确认新密码</label>
          <input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" aria-describedby="password-policy-hint" required>
        </div>
        <button id="submit" class="primary" type="submit" disabled>更新密码</button>
      </form>

      <div id="message" class="message" role="status"></div>
      <p class="footer">忘记当前密码时，请返回 <a class="link" href="/login.html">登录页</a> 使用“忘记密码”邮件重置。</p>
    </section>
  </main>

  <script data-hosted-entry="change-password"></script>
</body>
</html>
