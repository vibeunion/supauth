<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SupaOAuth Account Claim</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #18202f;
      --muted: #647084;
      --line: #d8dee8;
      --panel: #ffffff;
      --bg: #f4f7fb;
      --brand: #13736f;
      --brand-dark: #0d5855;
      --danger: #b42318;
      --success: #067647;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        linear-gradient(180deg, rgba(255,255,255,.72), rgba(244,247,251,.94)),
        radial-gradient(circle at 20% 0%, rgba(19,115,111,.18), transparent 35%),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(100%, 460px);
    }

    .brand {
      margin-bottom: 18px;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      background: var(--ink);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 800;
      letter-spacing: 0;
    }

    h1 {
      margin: 16px 0 6px;
      font-size: 28px;
      line-height: 1.18;
      letter-spacing: 0;
    }

    .lead {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }

    .panel {
      margin-top: 22px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 18px 48px rgba(17, 24, 39, .08);
      padding: 22px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #334155;
      font-size: 13px;
      font-weight: 650;
    }

    input {
      width: 100%;
      height: 44px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      padding: 0 12px;
      color: var(--ink);
      font-size: 15px;
      outline: none;
      background: #fff;
    }

    input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(19, 115, 111, .14);
    }

    .field + .field {
      margin-top: 16px;
    }

    button {
      border: 0;
      border-radius: 7px;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }

    .primary {
      width: 100%;
      height: 44px;
      margin-top: 20px;
      color: #fff;
      background: var(--brand);
    }

    .primary:hover { background: var(--brand-dark); }
    .primary:disabled { cursor: not-allowed; opacity: .62; }

    .result {
      display: none;
      margin-top: 18px;
      border: 1px solid #c9d7e4;
      background: #f8fbfd;
      border-radius: 8px;
      padding: 16px;
    }

    .result.active { display: block; }

    .row {
      display: grid;
      gap: 6px;
      padding: 10px 0;
      border-bottom: 1px solid #e4eaf1;
    }

    .row:last-child { border-bottom: 0; }

    .key {
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    .value {
      min-width: 0;
      overflow-wrap: anywhere;
      font-size: 16px;
      font-weight: 750;
      letter-spacing: 0;
    }

    .copy {
      justify-self: start;
      height: 32px;
      padding: 0 10px;
      color: var(--brand-dark);
      background: #e7f2f1;
      font-size: 13px;
    }

    .message {
      display: none;
      margin-top: 14px;
      font-size: 14px;
      line-height: 1.55;
    }

    .message.active { display: block; }
    .message.error { color: var(--danger); }
    .message.success { color: var(--success); }
    .message.muted { color: var(--muted); }

    .footer {
      margin-top: 18px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }
  </style>
  <script>
    window.__SUPAOAUTH_PUBLIC_API_BASE__ = null;
  </script>
</head>
<body>
  <main>
    <section class="brand" aria-label="SupaOAuth">
      <div class="brand-mark">SO</div>
      <h1>领取 SupAuth 账号</h1>
      <p class="lead">输入姓名和数字 ID，查询你的登录邮箱并领取一次性初始密码。</p>
    </section>

    <section class="panel">
      <form id="claim-form" novalidate>
        <div class="field">
          <label for="name">姓名</label>
          <input id="name" name="name" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="external-id">数字 ID</label>
          <input id="external-id" name="external_id" inputmode="numeric" autocomplete="off" required>
        </div>
        <button id="submit" class="primary" type="submit">查询账号</button>
      </form>

      <div id="message" class="message" role="status"></div>

      <div id="result" class="result" aria-live="polite">
        <div class="row">
          <div class="key">登录邮箱</div>
          <div id="email" class="value"></div>
          <button class="copy" type="button" data-copy="email">复制邮箱</button>
        </div>
        <div id="password-row" class="row">
          <div class="key">初始密码</div>
          <div id="password" class="value"></div>
          <button class="copy" type="button" data-copy="password">复制密码</button>
        </div>
      </div>

      <p class="footer">初始密码只展示一次。再次查询时只会显示邮箱。</p>
    </section>
  </main>

  <script>
    const apiBase = (window.__SUPAOAUTH_PUBLIC_API_BASE__ || '/v1/public').replace(/\/$/, '');
    const form = document.getElementById('claim-form');
    const submit = document.getElementById('submit');
    const message = document.getElementById('message');
    const result = document.getElementById('result');
    const emailEl = document.getElementById('email');
    const passwordRow = document.getElementById('password-row');
    const passwordEl = document.getElementById('password');

    function setMessage(kind, text) {
      message.className = `message active ${kind}`;
      message.textContent = text;
    }

    function clearResult() {
      result.classList.remove('active');
      emailEl.textContent = '';
      passwordEl.textContent = '';
      passwordRow.style.display = '';
    }

    function showResult(data) {
      emailEl.textContent = data.email || '';
      if (data.initial_password) {
        passwordRow.style.display = '';
        passwordEl.textContent = data.initial_password;
        setMessage('success', '账号领取成功，请尽快登录并修改密码。');
      } else {
        passwordRow.style.display = 'none';
        const text = data.status === 'already_claimed'
          ? '初始密码已领取，如忘记密码请联系管理员重置。'
          : '账号已找到，但初始密码不可用，请联系管理员。';
        setMessage('muted', text);
      }
      result.classList.add('active');
    }

    async function copyText(targetId) {
      const target = targetId === 'password' ? passwordEl : emailEl;
      const text = target.textContent.trim();
      if (!text) return;
      await navigator.clipboard.writeText(text);
      setMessage('success', targetId === 'password' ? '密码已复制。' : '邮箱已复制。');
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      clearResult();
      const name = form.name.value.trim();
      const externalId = form.external_id.value.trim();
      if (!name || !externalId) {
        setMessage('error', '请填写姓名和数字 ID。');
        return;
      }

      submit.disabled = true;
      submit.textContent = '查询中...';
      try {
        const response = await fetch(`${apiBase}/account-claims/claim`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ display_name: name, external_id: externalId, external_type: 'employee' }),
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data.success) {
          setMessage('error', response.status === 429 ? '查询次数过多，请稍后再试。' : '未找到匹配账号，请核对姓名和数字 ID。');
          return;
        }
        showResult(data);
      } catch {
        setMessage('error', '查询失败，请稍后重试。');
      } finally {
        submit.disabled = false;
        submit.textContent = '查询账号';
      }
    });

    document.querySelectorAll('[data-copy]').forEach((button) => {
      button.addEventListener('click', () => copyText(button.getAttribute('data-copy')));
    });
  </script>
</body>
</html>
