<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SupaOAuth Account Claim</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #18202f;
      --muted: #647084;
      --line: #d8dee8;
      --panel: #ffffff;
      --bg: #f4f7fb;
      --brand: #13736f;
      --brand-dark: #0d5855;
      --danger: #b42318;
      --success: #067647;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        linear-gradient(180deg, rgba(255,255,255,.72), rgba(244,247,251,.94)),
        radial-gradient(circle at 20% 0%, rgba(19,115,111,.18), transparent 35%),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    body.has-bg {
      background-position: center;
      background-size: cover;
    }

    body.has-bg::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.72);
    }

    main {
      position: relative;
      width: min(100%, 460px);
    }

    .brand {
      margin-bottom: 18px;
    }

    .topbar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 12px;
    }

    .language-select {
      width: auto;
      height: 34px;
      border-radius: 7px;
      font-size: 13px;
      background: rgba(255, 255, 255, .86);
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      background: var(--ink);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 800;
      letter-spacing: 0;
    }

    .logo {
      display: none;
      max-width: 180px;
      max-height: 72px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 16px 0 6px;
      font-size: 28px;
      line-height: 1.18;
      letter-spacing: 0;
    }

    .lead {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }

    .panel {
      margin-top: 22px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 18px 48px rgba(17, 24, 39, .08);
      padding: 22px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #334155;
      font-size: 13px;
      font-weight: 650;
    }

    input {
      width: 100%;
      height: 44px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      padding: 0 12px;
      color: var(--ink);
      font-size: 15px;
      outline: none;
      background: #fff;
    }

    input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(19, 115, 111, .14);
    }

    .field + .field {
      margin-top: 16px;
    }

    #password-fields {
      margin-top: 16px;
    }

    button {
      border: 0;
      border-radius: 7px;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }

    .primary {
      width: 100%;
      height: 44px;
      margin-top: 20px;
      color: #fff;
      background: var(--brand);
    }

    .primary:hover { background: var(--brand-dark); }
    .primary:disabled { cursor: not-allowed; opacity: .62; }

    .result {
      display: none;
      margin-top: 18px;
      border: 1px solid #c9d7e4;
      background: #f8fbfd;
      border-radius: 8px;
      padding: 16px;
    }

    .result.active { display: block; }

    .row {
      display: grid;
      gap: 6px;
      padding: 10px 0;
      border-bottom: 1px solid #e4eaf1;
    }

    .row:last-child { border-bottom: 0; }

    .key {
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    .value {
      min-width: 0;
      overflow-wrap: anywhere;
      font-size: 16px;
      font-weight: 750;
      letter-spacing: 0;
    }

    .copy {
      justify-self: start;
      height: 32px;
      padding: 0 10px;
      color: var(--brand-dark);
      background: #e7f2f1;
      font-size: 13px;
    }

    .message {
      display: none;
      margin-top: 14px;
      font-size: 14px;
      line-height: 1.55;
    }

    .message.active { display: block; }
    .message.error { color: var(--danger); }
    .message.success { color: var(--success); }
    .message.muted { color: var(--muted); }

    .password-hint {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .footer {
      margin-top: 18px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }
  </style>
  <style id="custom-style"></style>
  <script data-hosted-entry="public-api-base"></script>
</head>
<body>
  <main>
    <div class="topbar">
      <select id="language" class="language-select" aria-label="Language">
        <option value="zh-CN">中文</option>
        <option value="en">English</option>
      </select>
    </div>
    <section id="brand" class="brand" aria-label="SupAuth">
      <img id="logo" class="logo" alt="">
      <div id="brand-mark" class="brand-mark">SA</div>
      <h1 id="claim-title">领取 SupAuth 账号</h1>
      <p id="claim-lead" class="lead">输入数字 ID，查询你的登录邮箱并领取一次性初始密码。</p>
    </section>

    <section class="panel">
      <form id="claim-form" novalidate>
        <div class="field">
          <label id="external-id-label" for="external-id">数字 ID</label>
          <input id="external-id" name="external_id" inputmode="numeric" autocomplete="off" required>
        </div>
        <div id="password-fields" hidden>
          <div class="field">
            <label id="new-password-label" for="new-password">设置登录密码</label>
            <input id="new-password" name="new_password" type="password" autocomplete="new-password">
          </div>
          <div class="field">
            <label id="confirm-password-label" for="confirm-password">确认登录密码</label>
            <input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password">
          </div>
          <p id="password-policy-hint" class="password-hint" role="note"></p>
        </div>
        <button id="submit" class="primary" type="submit" disabled>查询账号</button>
      </form>

      <div id="message" class="message" role="status"></div>

      <div id="result" class="result" aria-live="polite">
        <div class="row">
          <div class="key">登录邮箱</div>
          <div id="email" class="value"></div>
          <button id="copy-email" class="copy" type="button" data-copy="email">复制邮箱</button>
        </div>
        <div id="password-row" class="row">
          <div class="key">初始密码</div>
          <div id="password" class="value"></div>
          <button id="copy-password" class="copy" type="button" data-copy="password">复制密码</button>
        </div>
      </div>

      <p id="claim-footer" class="footer">初始密码只展示一次。再次查询时只会显示邮箱。</p>
    </section>
  </main>

  <script data-hosted-entry="claim"></script>
</body>
</html>
