<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="supaoauth-api-base" content="">
    <title>SupaOAuth Sign In</title>
    <style>
      * { box-sizing: border-box; }
      :root { --primary: #2563eb; }
      html, body { height: 100%; }
      body {
        margin: 0;
        min-height: 100vh;
        background: #f1f5f9;
        color: #111827;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body.has-bg {
        background-position: center;
        background-size: cover;
      }
      /* Split layout: left brand/intro panel + right auth form panel */
      .split-layout {
        display: flex;
        min-height: 100vh;
      }
      .brand-panel {
        flex: 1 1 0;
        min-width: 0;
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 64px 56px;
        color: #e2e8f0;
        background: linear-gradient(150deg, #0b1220 0%, #1e1b4b 55%, #312e81 100%);
      }
      .brand-panel::after {
        content: "";
        position: absolute;
        width: 560px;
        height: 560px;
        right: -200px;
        top: -160px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(129, 140, 248, 0.35), transparent 68%);
        pointer-events: none;
      }
      .brand-panel::before {
        content: "";
        position: absolute;
        width: 420px;
        height: 420px;
        left: -150px;
        bottom: -140px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(56, 189, 248, 0.16), transparent 70%);
        pointer-events: none;
      }
      .brand-inner {
        position: relative;
        z-index: 1;
        max-width: 480px;
      }
      .brand-panel .logo {
        display: none;
        max-width: 200px;
        max-height: 76px;
        margin: 0 0 28px;
      }
      .brand-mark {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 64px;
        height: 64px;
        margin: 0 0 26px;
        border-radius: 18px;
        background: linear-gradient(135deg, rgba(129, 140, 248, 0.22), rgba(56, 189, 248, 0.10));
        border: 1px solid rgba(129, 140, 248, 0.32);
        box-shadow: 0 10px 30px rgba(49, 46, 129, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        color: #c7d2fe;
      }
      .brand-panel h1 {
        margin: 0 0 14px;
        text-align: left;
        font-size: 32px;
        font-weight: 800;
        color: #ffffff;
        letter-spacing: -0.02em;
        line-height: 1.2;
      }
      .brand-panel .subtitle {
        margin: 0 0 28px;
        text-align: left;
        color: #a5b4fc;
        font-size: 15px;
        font-weight: 500;
      }
      .brand-panel .intro {
        margin: 0 0 24px;
        text-align: left;
        color: #cbd5e1;
        font-size: 14px;
        line-height: 1.75;
        white-space: pre-line;
      }
      .brand-panel #custom-content { margin: 0; }
      .brand-panel #custom-content:empty { display: none; }
      .brand-panel #custom-content img,
      .brand-panel #custom-content svg {
        max-width: 100%;
        height: auto;
        display: block;
        margin: 0 0 16px;
      }
      .brand-panel #custom-content p {
        margin: 0 0 10px;
        line-height: 1.75;
        font-size: 14px;
        color: #cbd5e1;
      }
      .brand-illustration {
        display: none;
        width: min(100%, 420px);
        margin: 0 0 26px;
        color: #a5b4fc;
      }
      .brand-illustration svg {
        display: block;
        width: 100%;
        height: auto;
      }
      .feature-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
      .feature-card {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
        padding: 12px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.05);
      }
      .feature-icon {
        display: flex;
        flex: 0 0 auto;
        color: #a5b4fc;
      }
      .feature-text {
        min-width: 0;
        line-height: 1.35;
      }
      .feature-title {
        display: block;
        color: #f8fafc;
        font-size: 12.5px;
        font-weight: 700;
      }
      .feature-desc {
        display: block;
        margin-top: 2px;
        color: #94a3b8;
        font-size: 11px;
      }
      .auth-panel {
        flex: 0 0 500px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 48px 44px;
        background: #ffffff;
        position: relative;
      }
      .language-select {
        position: absolute;
        top: 18px;
        right: 18px;
        height: 30px;
        padding: 0 8px;
        border: 1px solid #d1d5db;
        border-radius: 7px;
        background: #fff;
        color: #374151;
        font-size: 12px;
      }
      @media (max-width: 920px) {
        .split-layout { flex-direction: column; }
        .brand-panel { flex: 0 0 auto; padding: 44px 32px 32px; }
        .brand-panel h1 { font-size: 26px; }
        .auth-panel { flex: 1 1 auto; padding: 36px 28px 44px; }
      }
      @media (max-width: 480px) {
        .brand-panel { padding: 36px 24px 24px; }
        .brand-panel h1 { font-size: 22px; }
        .auth-panel { padding: 28px 22px 36px; }
        .feature-grid { grid-template-columns: 1fr; }
      }
      label {
        display: block;
        margin: 0 0 6px;
        color: #374151;
        font-size: 13px;
        font-weight: 600;
      }
      input {
        width: 100%;
        height: 42px;
        margin: 0 0 14px;
        padding: 0 12px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 14px;
        outline: none;
      }
      input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 16%, transparent);
      }
      button {
        width: 100%;
        height: 44px;
        border: 0;
        border-radius: 8px;
        background: var(--primary);
        color: #fff;
        cursor: pointer;
        font-size: 15px;
        font-weight: 700;
      }
      button:disabled { opacity: 0.65; cursor: wait; }
      .message {
        display: none;
        margin: 0 0 14px;
        padding: 10px 12px;
        border-radius: 8px;
        font-size: 13px;
      }
      .message.error { display: block; background: #fef2f2; color: #991b1b; }
      .message.ok { display: block; background: #ecfdf5; color: #065f46; }
      .footer {
        margin-top: 18px;
        text-align: center;
        color: #9ca3af;
        font-size: 12px;
      }
      /* Tab switcher for sign-in / sign-up / forgot-password */
      .tabs {
        display: flex;
        gap: 0;
        margin: 0 0 20px;
        border-bottom: 2px solid #e5e7eb;
      }
      .tab-btn {
        flex: 1;
        height: 38px;
        border: 0;
        border-radius: 0;
        background: transparent;
        color: #6b7280;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        border-bottom: 2px solid transparent;
        margin-bottom: -2px;
        transition: color .15s, border-color .15s;
      }
      .tab-btn.active {
        color: var(--primary);
        border-bottom-color: var(--primary);
      }
      .tab-panel { display: none; }
      .tab-panel.active { display: block; }
      /* Social buttons */
      .social-buttons {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin: 14px 0 0;
      }
      .social-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        height: 42px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        background: #fff;
        color: #1f2937;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background .15s, border-color .15s, box-shadow .15s;
      }
      .social-btn:hover {
        background: #f9fafb;
        border-color: #c7ccd4;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
      }
      .divider {
        display: flex;
        align-items: center;
        margin: 22px 0 0;
        color: #9ca3af;
        font-size: 12px;
      }
      .divider::before, .divider::after {
        content: "";
        flex: 1;
        border-bottom: 1px solid #e5e7eb;
      }
      .divider span { padding: 0 12px; }
      .forgot-link {
        display: inline-block;
        margin: -6px 0 14px;
        color: var(--primary);
        font-size: 13px;
        text-decoration: none;
        cursor: pointer;
      }
      .forgot-link:hover { text-decoration: underline; }

    </style>
    <style id="custom-style"></style>
  </head>
  <body>
    <div class="split-layout">
      <aside class="brand-panel">
        <div class="brand-inner">
          <div id="brand-mark" class="brand-mark" aria-hidden="true">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none">
              <path d="M12 2.4 L20 5.5 V11.2 C20 16.3 16.4 20.5 12 21.8 C7.6 20.5 4 16.3 4 11.2 V5.5 Z" fill="url(#bm-shield)" stroke="rgba(199,210,254,0.6)" stroke-width="0.7"/>
              <circle cx="12" cy="10.2" r="2" fill="#0b1220"/>
              <path d="M12 12.1 V15.6 M10.7 15.6 H13.3" stroke="#0b1220" stroke-width="1.5" stroke-linecap="round"/>
              <defs>
                <linearGradient id="bm-shield" x1="4" y1="2.4" x2="20" y2="21.8" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#c7d2fe"/>
                  <stop offset="1" stop-color="#818cf8"/>
                </linearGradient>
              </defs>
            </svg>
          </div>
          <img id="logo" class="logo" alt="">
          <h1 id="title">SupaOAuth</h1>
          <p id="subtitle" class="subtitle">Sign in to continue</p>
          <p id="intro" class="intro" style="display:none"></p>
          <div id="brand-illustration" class="brand-illustration" aria-hidden="true"></div>
          <div id="custom-content"></div>
        </div>
      </aside>

      <main class="auth-panel">
        <select id="language" class="language-select" aria-label="Language">
          <option value="en">English</option>
          <option value="zh-CN">中文</option>
        </select>
        <div id="message" class="message"></div>

        <!-- Tabs: sign-in / sign-up / forgot-password -->
        <div id="tabs-nav" class="tabs">
          <button type="button" class="tab-btn active" data-tab="signin" id="tab-signin">Sign In</button>
          <button type="button" class="tab-btn" data-tab="signup" id="tab-signup" style="display:none">Sign Up</button>
          <button type="button" class="tab-btn" data-tab="forgot" id="tab-forgot" style="display:none">Forgot Password</button>
        </div>

        <!-- Sign In panel -->
        <div id="panel-signin" class="tab-panel active">
          <form id="login-form" novalidate>
            <label id="email-label" for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
            <a id="forgot-password-link" class="forgot-link" style="display:none">Forgot password?</a>
            <label id="password-label" for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button id="submit" type="submit">Sign In</button>
          </form>
        </div>

        <!-- Sign Up panel -->
        <div id="panel-signup" class="tab-panel">
          <form id="signup-form">
            <label id="signup-email-label" for="signup-email">Email</label>
            <input id="signup-email" name="email" type="email" autocomplete="email" required>
            <label id="signup-password-label" for="signup-password">Password</label>
            <input id="signup-password" name="password" type="password" autocomplete="new-password" required minlength="6">
            <button id="signup-submit" type="submit">Sign Up</button>
          </form>
        </div>

        <!-- Forgot Password panel -->
        <div id="panel-forgot" class="tab-panel">
          <form id="forgot-form">
            <label id="forgot-email-label" for="forgot-email">Email</label>
            <input id="forgot-email" name="email" type="email" autocomplete="email" required>
            <button id="forgot-submit" type="submit">Send Reset Link</button>
          </form>
        </div>

        <!-- Social login buttons -->
        <div id="social-divider" class="divider" style="display:none"><span id="or-text">or</span></div>
        <div id="social-section" class="social-buttons" style="display:none"></div>

        <div id="footer" class="footer">SupaOAuth Identity Provider</div>
      </main>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const authorizationId = params.get('authorization_id') || '';
      let authorizationRedirectUrl = params.get('redirect_to') || '';
      let authorizationAvailable = !authorizationId;
      let hasCustomPageTitle = false;
      let hasCustomButtonLabel = false;
      let signUpEnabled = false;
      let systemName = 'SupaOAuth';

      // ─── i18n defaults with phrase override support ─────────────────
      const LOCALE_STORAGE_KEY = 'supaoauth.locale';
      const defaultMessages = {
        en: {
          documentTitle: 'SupaOAuth Sign In',
          title: 'SupaOAuth',
          subtitle: 'Sign in to continue',
          email: 'Email',
          password: 'Password',
          submit: 'Sign In',
          signingIn: 'Signing in...',
          footer: 'SupaOAuth Identity Provider',
          loginFailed: 'Login failed',
          loginSuccess: 'Login successful.',
          redirecting: 'Login successful. Redirecting...',
          networkError: 'Network error',
          emailRequired: 'Enter your email address.',
          emailInvalid: 'Enter a valid email address.',
          passwordRequired: 'Enter your password.',
          invalidLoginCredentials: 'Account or password does not match. Please check and try again.',
          authorizationFailed: 'Authorization approval failed',
          authorizationExpired: 'This sign-in request has expired. Please return to the application and sign in again.',
          authorizationUnavailable: 'This sign-in request cannot be verified right now. Please return to the application and start sign-in again.',
          signIn: 'Sign In',
          signUp: 'Sign Up',
          forgotPassword: 'Forgot Password',
          signUpSubmit: 'Sign Up',
          signingUp: 'Signing up...',
          signUpSuccess: 'Account created. You can now sign in.',
          signUpFailed: 'Sign up failed',
          forgotEmailLabel: 'Email',
          forgotSubmit: 'Send Reset Link',
          sendingReset: 'Sending...',
          forgotSuccess: 'Password reset email sent. Check your inbox.',
          forgotFailed: 'Failed to send reset email',
          or: 'or',
          forgotLink: 'Forgot password?',
          backToSignIn: 'Back to Sign In',
        },
        'zh-CN': {
          documentTitle: 'SupaOAuth 登录',
          title: 'SupaOAuth',
          subtitle: '登录后继续',
          email: '邮箱',
          password: '密码',
          submit: '登录',
          signingIn: '正在登录...',
          footer: 'SupaOAuth 身份提供方',
          loginFailed: '登录失败',
          loginSuccess: '登录成功。',
          redirecting: '登录成功，正在跳转...',
          networkError: '网络错误',
          emailRequired: '请输入邮箱。',
          emailInvalid: '请输入正确的邮箱格式。',
          passwordRequired: '请输入密码。',
          invalidLoginCredentials: '账号或密码不匹配，请检查后重试。',
          authorizationFailed: '授权确认失败',
          authorizationExpired: '本次登录请求已过期，请返回应用重新发起登录。',
          authorizationUnavailable: '暂时无法校验本次登录请求，请返回应用重新发起登录。',
          signIn: '登录',
          signUp: '注册',
          forgotPassword: '忘记密码',
          signUpSubmit: '注册',
          signingUp: '正在注册...',
          signUpSuccess: '账号已创建，请登录。',
          signUpFailed: '注册失败',
          forgotEmailLabel: '邮箱',
          forgotSubmit: '发送重置链接',
          sendingReset: '正在发送...',
          forgotSuccess: '密码重置邮件已发送，请查看邮箱。',
          forgotFailed: '发送重置邮件失败',
          or: '或',
          forgotLink: '忘记密码？',
          backToSignIn: '返回登录',
        },
      };

      // Phrase overrides from API
      const phraseOverrides = {};

      function normalizeLocale(locale) {
        if (!locale) return null;
        const normalized = locale.replace('_', '-').toLowerCase();
        if (normalized === 'zh' || normalized.startsWith('zh-')) return 'zh-CN';
        if (normalized === 'en' || normalized.startsWith('en-')) return 'en';
        return null;
      }

      function localeCandidates() {
        const uiLocales = (params.get('ui_locales') || '').split(/\s+/).filter(Boolean);
        const stored = localStorage.getItem(LOCALE_STORAGE_KEY);
        const browserLocales = navigator.languages && navigator.languages.length
          ? navigator.languages
          : [navigator.language];
        return [...uiLocales, stored, ...browserLocales, 'en'];
      }

      function detectLocale() {
        for (const candidate of localeCandidates()) {
          const locale = normalizeLocale(candidate);
          if (locale && defaultMessages[locale]) return locale;
        }
        return 'en';
      }

      let currentLocale = detectLocale();

      function t(key) {
        // Phrase overrides take priority, then defaults
        if (phraseOverrides[currentLocale] && phraseOverrides[currentLocale][key]) {
          return phraseOverrides[currentLocale][key];
        }
        return (defaultMessages[currentLocale] && defaultMessages[currentLocale][key]) || defaultMessages.en[key] || key;
      }

      function renderFooter() {
        // 系统名由 sign-in-experience.page_title 驱动；默认仍为 SupaOAuth。
        if (systemName === 'SupaOAuth') return t('footer');
        return currentLocale === 'zh-CN' ? systemName + ' 身份提供方' : systemName + ' Identity Provider';
      }

      function applyLocale(locale, persist = false) {
        currentLocale = defaultMessages[locale] || phraseOverrides[locale] ? locale : 'en';
        document.documentElement.lang = currentLocale;
        document.getElementById('language').value = currentLocale;
        document.getElementById('subtitle').textContent = t('subtitle');
        document.getElementById('email-label').textContent = t('email');
        document.getElementById('password-label').textContent = t('password');
        document.getElementById('signup-email-label').textContent = t('email');
        document.getElementById('signup-password-label').textContent = t('password');
        document.getElementById('signup-submit').textContent = t('signUpSubmit');
        document.getElementById('forgot-email-label').textContent = t('forgotEmailLabel');
        document.getElementById('forgot-submit').textContent = t('forgotSubmit');
        document.getElementById('forgot-password-link').textContent = t('forgotLink');
        document.getElementById('tab-signin').textContent = t('signIn');
        document.getElementById('tab-signup').textContent = t('signUp');
        document.getElementById('tab-forgot').textContent = t('forgotPassword');
        document.getElementById('or-text').textContent = t('or');
        document.getElementById('footer').textContent = renderFooter();
        if (!hasCustomPageTitle) {
          document.title = t('documentTitle');
          document.getElementById('title').textContent = t('title');
        }
        if (!hasCustomButtonLabel) {
          document.getElementById('submit').textContent = t('submit');
        }
        if (persist) localStorage.setItem(LOCALE_STORAGE_KEY, currentLocale);
      }

      // ─── API helpers ─────────────────────────────────────────────────
      function publicApiBase() {
        const metaBase = document.querySelector('meta[name="supaoauth-api-base"]');
        if (metaBase && metaBase.content) return metaBase.content;
        const { protocol, hostname, port, origin } = window.location;
        if (hostname === '127.0.0.1' || hostname === 'localhost') {
          return `${protocol}//${hostname}:4010/v1/public`;
        }
        if (hostname.startsWith('auth.')) {
          return `${origin}/v1/public`;
        }
        if (hostname.startsWith('api.')) {
          return `${protocol}//${hostname.replace(/^api\./, 'auth.')}${port ? `:${port}` : ''}/api/v1/public`;
        }
        return `${origin}/api/v1/public`;
      }

      function setMessage(type, text) {
        const el = document.getElementById('message');
        el.className = `message ${type}`;
        el.textContent = text;
      }

      function clearMessage() {
        const el = document.getElementById('message');
        el.className = 'message';
        el.textContent = '';
      }

      function responseMessage(data, fallback) {
        if (!data || typeof data !== 'object') return fallback;
        return data.msg || data.error_description || data.error || fallback;
      }

      function apiErrorCode(data) {
        if (!data || typeof data !== 'object') return '';
        const code = data.error || data.error_code || data.code;
        return typeof code === 'string' ? code : '';
      }

      function createApiError(data, fallback) {
        const error = new Error(responseMessage(data, fallback));
        error.code = apiErrorCode(data);
        return error;
      }

      function isAuthorizationNotFoundError(error) {
        return !!(error && error.code === 'authorization_not_found');
      }

      async function completeStandaloneLogin(accessToken) {
        try {
          sessionStorage.setItem('supaoauth.account.access_token', accessToken);
        } catch {}
        setMessage('ok', t('redirecting'));
        window.location.href = `/account#access_token=${encodeURIComponent(accessToken)}`;
      }

      function normalizeEmailInput(value) {
        return String(value || '')
          .normalize('NFKC')
          .replace(/[\u200B-\u200D\uFEFF]/g, '')
          .trim();
      }

      function isValidEmail(value) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
      }

      function isInvalidCredentials(data) {
        const fields = [
          data && data.error,
          data && data.error_code,
          data && data.error_description,
          data && data.msg,
          data && data.message,
        ]
          .filter(Boolean)
          .map((value) => String(value).toLowerCase());
        return fields.some((value) => (
          value.includes('invalid login credentials') ||
          value.includes('invalid_credentials') ||
          value.includes('invalid credentials')
        ));
      }

      function loginResponseMessage(data) {
        if (data && typeof data === 'object' && isInvalidCredentials(data)) {
          return t('invalidLoginCredentials');
        }
        return responseMessage(data, t('loginFailed'));
      }

      function buildAuthorizeUrl(authorization) {
        const next = new URL('/auth/v1/oauth/authorize', window.location.origin);
        const fields = {
          client_id: authorization.client_id,
          redirect_uri: authorization.redirect_uri,
          response_type: authorization.response_type || 'code',
          scope: authorization.scope,
          state: authorization.state,
          resource: authorization.resource,
          code_challenge: authorization.code_challenge,
          code_challenge_method: authorization.code_challenge_method,
          nonce: authorization.nonce,
        };
        Object.entries(fields).forEach(([key, value]) => {
          if (value) next.searchParams.set(key, value);
        });
        return `${next.pathname}${next.search}`;
      }

      function safeRedirectUrl(value, allowExternal = false) {
        if (!value) return '';
        try {
          const url = new URL(value, window.location.origin);
          if (url.protocol !== 'http:' && url.protocol !== 'https:') return '';
          if (!allowExternal && url.origin !== window.location.origin) return '';
          return allowExternal ? url.toString() : `${url.pathname}${url.search}${url.hash}`;
        } catch {
          return '';
        }
      }

      async function approveAuthorization(accessToken) {
        if (!authorizationId) return null;
        if (!authorizationAvailable) throw new Error(t('authorizationExpired'));
        const res = await fetch(`${publicApiBase()}/oauth/authorizations/${encodeURIComponent(authorizationId)}/approve`, {
          method: 'POST',
          headers: { Authorization: `Bearer ${accessToken}` },
        });
        const data = await res.json().catch(() => null);
        if (!res.ok) {
          throw createApiError(data, t('authorizationFailed'));
        }
        return data && typeof data === 'object' ? data.redirect_url || null : null;
      }

      function disableExpiredAuthorization() {
        authorizationAvailable = false;
        setMessage('error', t('authorizationExpired'));
        ['email', 'password', 'submit'].forEach((id) => {
          const el = document.getElementById(id);
          if (el) el.disabled = true;
        });
      }

      function disableUnavailableAuthorization() {
        authorizationAvailable = false;
        setMessage('error', t('authorizationUnavailable'));
        ['email', 'password', 'submit'].forEach((id) => {
          const el = document.getElementById(id);
          if (el) el.disabled = true;
        });
      }

      function normalizeIllustration(content) {
        if (!content || typeof content !== 'object' || Array.isArray(content)) return '';
        const illustration = String(content.illustration || '').trim();
        return illustrationThemes[illustration] ? illustration : '';
      }

      function normalizeContentItems(content) {
        if (Array.isArray(content)) return content;
        if (content && typeof content === 'object' && Array.isArray(content.items)) return content.items;
        if (content && typeof content === 'object' && Array.isArray(content.features)) return content.features;
        return [];
      }

      function renderFeatureCards(container, items) {
        const grid = document.createElement('div');
        grid.className = 'feature-grid';
        items.slice(0, 8).forEach((item) => {
          if (!item || typeof item !== 'object') return;
          const title = String(item.title || item.name || '').trim();
          const desc = String(item.desc || item.description || '').trim();
          if (!title && !desc) return;

          const card = document.createElement('div');
          card.className = 'feature-card';

          const icon = document.createElement('span');
          icon.className = 'feature-icon';
          const iconName = String(item.icon || 'shield').trim();
          icon.innerHTML = featureIcons[iconName] || featureIcons.shield;

          const text = document.createElement('span');
          text.className = 'feature-text';
          const titleEl = document.createElement('strong');
          titleEl.className = 'feature-title';
          titleEl.textContent = title;
          const descEl = document.createElement('span');
          descEl.className = 'feature-desc';
          descEl.textContent = desc;

          text.appendChild(titleEl);
          if (desc) text.appendChild(descEl);
          card.appendChild(icon);
          card.appendChild(text);
          grid.appendChild(card);
        });
        if (grid.childElementCount) container.appendChild(grid);
      }

      function renderBrandingContent(content) {
        renderBrandIllustration(content);
        const container = document.getElementById('custom-content');
        container.replaceChildren();
        renderFeatureCards(container, normalizeContentItems(content));
      }

      function renderBrandIllustration(content) {
        const container = document.getElementById('brand-illustration');
        const illustration = normalizeIllustration(content);
        container.replaceChildren();
        if (!illustration) {
          container.style.display = 'none';
          return;
        }
        container.innerHTML = illustration;
        container.style.display = 'block';
      }

      // ─── Load phrases from API ────────────────────────────────────────
      async function loadPhrases(locale) {
        try {
          const res = await fetch(`${publicApiBase()}/phrases/${encodeURIComponent(locale)}`);
          if (!res.ok) return;
          const data = await res.json();
          if (data && data.phrases && typeof data.phrases === 'object' && Object.keys(data.phrases).length > 0) {
            phraseOverrides[locale] = data.phrases;
          }
        } catch {}
      }

      // ─── Load experience (branding + connectors + custom content) ───────────
      async function loadExperience() {
        const url = authorizationId
          ? `${publicApiBase()}/sign-in-experience/resolve?authorization_id=${encodeURIComponent(authorizationId)}`
          : `${publicApiBase()}/sign-in-experience/resolve`;
        try {
          const res = await fetch(url, { credentials: 'include' });
          if (!res.ok) {
            if (authorizationId) disableUnavailableAuthorization();
            return;
          }
          const experience = await res.json();
          if (authorizationId) {
            authorizationAvailable = !!experience.authorization;
            if (!authorizationAvailable) {
              disableExpiredAuthorization();
            }
          }
          if (experience.authorization) {
            if (!authorizationRedirectUrl) authorizationRedirectUrl = buildAuthorizeUrl(experience.authorization);
          }
          const branding = experience.branding || {};

          // Branding
          if (branding.page_title) {
            hasCustomPageTitle = true;
            systemName = branding.page_title;
            document.title = branding.page_title;
            document.getElementById('title').textContent = branding.page_title;
            document.getElementById('footer').textContent = renderFooter();
          }
          if (branding.description && branding.description.trim()) {
            const intro = document.getElementById('intro');
            intro.textContent = branding.description.trim();
            intro.style.display = 'block';
          }
          if (branding.primary_color) {
            document.documentElement.style.setProperty('--primary', branding.primary_color);
          }
          if (branding.logo_url) {
            const logo = document.getElementById('logo');
            logo.src = branding.logo_url;
            logo.style.display = 'block';
            document.getElementById('brand-mark').style.display = 'none';
          }
          if (branding.favicon_url) {
            const icon = document.createElement('link');
            icon.rel = 'icon';
            icon.href = branding.favicon_url;
            document.head.appendChild(icon);
          }
          if (branding.background_url) {
            document.body.classList.add('has-bg');
            document.body.style.backgroundImage = `url("${branding.background_url}")`;
          }
          if (branding.button_label) {
            hasCustomButtonLabel = true;
            document.getElementById('submit').textContent = branding.button_label;
          }
          if (branding.custom_css) {
            document.getElementById('custom-style').textContent = branding.custom_css;
          }

          renderBrandingContent(branding.content);

          if (experience.authorization_error) {
            if (authorizationId) disableUnavailableAuthorization();
            return;
          }

          // Social connectors
          if (experience.connectors && experience.connectors.length > 0) {
            renderSocialButtons(experience.connectors);
          }

          // Sign-up enabled
          if (experience.sign_up_enabled === true || experience.sign_up_enabled === undefined) {
            signUpEnabled = true;
            document.getElementById('tab-signup').style.display = '';
          }

          // Forgot password link always visible (GoTrue supports it)
          document.getElementById('forgot-password-link').style.display = '';
          document.getElementById('tab-forgot').style.display = '';
        } catch {
          if (authorizationId) disableUnavailableAuthorization();
        }
      }

      // ─── Sign In ──────────────────────────────────────────────────────
      document.getElementById('login-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const email = normalizeEmailInput(emailInput.value);
        const password = passwordInput.value;
        emailInput.value = email;
        if (!authorizationAvailable) {
          setMessage('error', t('authorizationExpired'));
          return;
        }
        if (!email) {
          setMessage('error', t('emailRequired'));
          emailInput.focus();
          return;
        }
        if (!isValidEmail(email)) {
          setMessage('error', t('emailInvalid'));
          emailInput.focus();
          return;
        }
        if (!password) {
          setMessage('error', t('passwordRequired'));
          passwordInput.focus();
          return;
        }
        const button = document.getElementById('submit');
        button.disabled = true;
        const originalText = button.textContent;
        button.textContent = t('signingIn');
        try {
          const res = await fetch('/auth/v1/token?grant_type=password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({
              email,
              password,
            }),
          });
          const data = await res.json().catch(() => null);
          if (!res.ok) {
            setMessage('error', loginResponseMessage(data));
            return;
          }
          if (!data || typeof data !== 'object' || !data.access_token) {
            setMessage('error', t('loginFailed'));
            return;
          }
          let approvedRedirectUrl = null;
          try {
            approvedRedirectUrl = await approveAuthorization(data.access_token);
          } catch (error) {
            if (isAuthorizationNotFoundError(error)) {
              await completeStandaloneLogin(data.access_token);
              return;
            }
            throw error;
          }
          const redirectUrl = approvedRedirectUrl
            ? safeRedirectUrl(approvedRedirectUrl, true)
            : safeRedirectUrl(authorizationRedirectUrl);
          if (redirectUrl) {
            setMessage('ok', t('redirecting'));
            window.location.href = redirectUrl;
          } else {
            await completeStandaloneLogin(data.access_token);
          }
        } catch (error) {
          setMessage('error', error && error.message ? error.message : t('networkError'));
        } finally {
          button.disabled = false;
          button.textContent = originalText;
        }
      });

      // ─── Sign Up ──────────────────────────────────────────────────────
      document.getElementById('signup-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const button = document.getElementById('signup-submit');
        button.disabled = true;
        const originalText = button.textContent;
        button.textContent = t('signingUp');
        try {
          const res = await fetch('/auth/v1/signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({
              email: document.getElementById('signup-email').value,
              password: document.getElementById('signup-password').value,
            }),
          });
          const data = await res.json().catch(() => null);
          if (!res.ok) {
            setMessage('error', responseMessage(data, t('signUpFailed')));
            return;
          }
          setMessage('ok', t('signUpSuccess'));
          // Switch to sign-in tab after successful sign-up
          setTimeout(() => {
            switchTab('signin');
            document.getElementById('email').value = document.getElementById('signup-email').value;
          }, 1500);
        } catch {
          setMessage('error', t('networkError'));
        } finally {
          button.disabled = false;
          button.textContent = originalText;
        }
      });

      // ─── Forgot Password ──────────────────────────────────────────────
      document.getElementById('forgot-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const button = document.getElementById('forgot-submit');
        button.disabled = true;
        const originalText = button.textContent;
        button.textContent = t('sendingReset');
        try {
          const res = await fetch('/auth/v1/recover', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({
              email: document.getElementById('forgot-email').value,
            }),
          });
          if (!res.ok) {
            const data = await res.json().catch(() => null);
            setMessage('error', responseMessage(data, t('forgotFailed')));
            return;
          }
          setMessage('ok', t('forgotSuccess'));
        } catch {
          setMessage('error', t('networkError'));
        } finally {
          button.disabled = false;
          button.textContent = originalText;
        }
      });

      // ─── Language switch ──────────────────────────────────────────────
      document.getElementById('language').addEventListener('change', async (event) => {
        const locale = event.target.value;
        await loadPhrases(locale);
        applyLocale(locale, true);
      });

      // ─── Init ─────────────────────────────────────────────────────────
      async function init() {
        await loadPhrases(currentLocale);
        applyLocale(currentLocale);
        await loadExperience();
      }
      init();
    </script>
  </body>
</html>
