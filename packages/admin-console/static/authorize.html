<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="supaoauth-api-base" content="">
    <title>SupaOAuth Sign In</title>
    <style>
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      :root { --primary: #2563eb; }
      html, body { height: 100%; }
      body {
        margin: 0;
        min-height: 100vh;
        background: #f1f5f9;
        color: #111827;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      body.has-bg {
        background-position: center;
        background-size: cover;
      }
      /* Split layout: left brand/intro panel + right auth form panel */
      .split-layout {
        display: flex;
        min-height: 100vh;
      }
      .brand-panel {
        flex: 1 1 0;
        min-width: 0;
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 80px 64px;
        color: #e2e8f0;
        background: radial-gradient(rgba(199,210,254,0.04) 1px, transparent 1px) 0 0 / 26px 26px, linear-gradient(150deg, #0b1220 0%, #1e1b4b 55%, #312e81 100%);
      }
      .brand-panel::after {
        content: "";
        position: absolute;
        width: 560px;
        height: 560px;
        right: -200px;
        top: -160px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(129, 140, 248, 0.28), transparent 70%);
        pointer-events: none;
      }
      .brand-panel::before {
        content: "";
        position: absolute;
        width: 420px;
        height: 420px;
        left: -150px;
        bottom: -140px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(56, 189, 248, 0.12), transparent 70%);
        pointer-events: none;
      }
      .brand-inner {
        position: relative;
        z-index: 1;
        max-width: 500px;
        animation: brand-reveal 0.5s ease-out both;
      }
      @keyframes brand-reveal {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .brand-panel .logo {
        display: none;
        max-width: 200px;
        max-height: 76px;
        margin: 0 0 28px;
      }
      .brand-mark {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 72px;
        height: 72px;
        margin: 0 0 28px;
        border-radius: 22px;
        background: linear-gradient(135deg, rgba(129, 140, 248, 0.22), rgba(56, 189, 248, 0.10));
        border: 1px solid rgba(129, 140, 248, 0.32);
        box-shadow: 0 12px 32px rgba(9, 9, 20, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        color: #c7d2fe;
      }
      .brand-panel h1 {
        margin: 0 0 16px;
        text-align: left;
        font-size: 42px;
        font-weight: 800;
        color: #ffffff;
        letter-spacing: -0.02em;
        line-height: 1.2;
      }
      .brand-panel .subtitle {
        margin: 0 0 32px;
        text-align: left;
        color: #a5b4fc;
        font-size: 18px;
        font-weight: 500;
        letter-spacing: -0.01em;
      }
      .brand-panel .intro {
        margin: 0 0 24px;
        text-align: left;
        color: #cbd5e1;
        font-size: 16px;
        line-height: 1.75;
        white-space: pre-line;
      }
      .brand-panel #custom-content { margin: 0; }
      .brand-panel #custom-content:empty { display: none; }
      #custom-content > .feature-grid {
        grid-column: 1 / -1;
        width: 100%;
        min-width: 0;
      }
      .brand-panel #custom-content img,
      .brand-panel #custom-content svg {
        max-width: 100%;
        height: auto;
        display: block;
        margin: 0 0 16px;
      }
      .brand-panel #custom-content p {
        margin: 0 0 10px;
        line-height: 1.75;
        font-size: 16px;
        color: #cbd5e1;
      }
      .brand-illustration {
        display: none;
        width: min(100%, 460px);
        margin: 0 0 32px;
        color: #a5b4fc;
        animation: brand-float 5s ease-in-out infinite;
      }
      .brand-illustration svg {
        display: block;
        width: 100%;
        height: auto;
      }
      @keyframes brand-float {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-6px) scale(1.01); }
      }
      .feature-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
      .feature-card {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
        padding: 14px;
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.04);
        transition: border-color 0.2s, background-color 0.2s;
      }
      .feature-card:hover {
        border-color: rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.07);
      }
      .feature-icon {
        display: flex;
        flex: 0 0 auto;
        color: #a5b4fc;
      }
      .feature-text {
        min-width: 0;
        line-height: 1.35;
      }
      .feature-title {
        display: block;
        color: #f8fafc;
        font-size: 14px;
        font-weight: 700;
      }
      .feature-desc {
        display: block;
        margin-top: 2px;
        color: #94a3b8;
        font-size: 12.5px;
      }
      .auth-panel {
        flex: 0 0 560px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 64px 56px;
        background: #ffffff;
        position: relative;
        box-shadow: -10px 0 30px rgba(15, 23, 42, 0.02);
      }
      .language-select {
        position: absolute;
        top: 20px;
        right: 20px;
        height: 34px;
        padding: 0 12px;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        background: #fff;
        color: #4b5563;
        font-size: 13px;
        font-weight: 500;
        outline: none;
        cursor: pointer;
        transition: border-color 0.15s;
      }
      .language-select:focus {
        border-color: var(--primary);
      }
      @media (max-width: 920px) {
        .split-layout { flex-direction: column; }
        .brand-panel { flex: 0 0 auto; padding: 44px 32px 32px; text-align: center; }
        .brand-panel h1 { font-size: 32px; text-align: center; }
        .brand-panel .subtitle { text-align: center; margin-bottom: 20px; }
        .brand-panel .intro { text-align: center; }
        .brand-mark { margin: 0 auto 24px; }
        .brand-panel .logo { margin: 0 auto 24px; }
        .brand-illustration { width: min(100%, 280px); margin: 0 auto 24px; }
        .feature-grid { max-width: 440px; margin: 0 auto; }
        .auth-panel { flex: 1 1 auto; padding: 36px 28px 44px; }
      }
      @media (max-width: 480px) {
        .brand-panel { padding: 36px 24px 24px; }
        .brand-panel h1 { font-size: 22px; }
        .auth-panel { padding: 28px 22px 36px; }
        .feature-grid { grid-template-columns: 1fr; }
      }
      label {
        display: block;
        margin: 0 0 8px;
        color: #4b5563;
        font-size: 15px;
        font-weight: 600;
      }
      input {
        width: 100%;
        height: 50px;
        margin: 0 0 18px;
        padding: 0 16px;
        border: 1px solid #e2e8f0;
        background: #f8fafc;
        border-radius: 9px;
        color: #1f2937;
        font-size: 16px;
        outline: none;
        transition: border-color 0.15s, box-shadow 0.15s, background-color 0.15s;
      }
      input:focus {
        border-color: var(--primary);
        background: #ffffff;
        box-shadow: 0 0 0 4px color-mix(in srgb, var(--primary) 10%, transparent);
      }
      .password-hint {
        margin: -8px 0 18px;
        color: #64748b;
        font-size: 13px;
        line-height: 1.5;
      }
      button {
        width: 100%;
        height: 52px;
        border: 0;
        border-radius: 9px;
        background: var(--primary);
        color: #fff;
        cursor: pointer;
        font-size: 17px;
        font-weight: 700;
        transition: transform 0.1s, box-shadow 0.15s, filter 0.15s;
      }
      button:hover:not(:disabled) {
        filter: brightness(1.05);
        box-shadow: 0 4px 14px color-mix(in srgb, var(--primary) 22%, transparent);
      }
      button:active:not(:disabled) {
        transform: scale(0.985);
      }
      button:disabled { opacity: 0.65; cursor: wait; }
      .message {
        display: none;
        margin: 0 0 16px;
        padding: 12px 14px;
        border-radius: 9px;
        font-size: 14px;
        line-height: 1.4;
      }
      .message.error { display: block; background: #fef2f2; color: #991b1b; border: 1px solid #fee2e2; }
      .message.ok { display: block; background: #ecfdf5; color: #065f46; border: 1px solid #d1fae5; }
      .footer {
        margin-top: 26px;
        text-align: center;
        color: #9ca3af;
        font-size: 13px;
      }
      /* Tab switcher for sign-in / sign-up / forgot-password */
      .tabs {
        display: flex;
        gap: 0;
        margin: 0 0 24px;
        border-bottom: 2px solid #e5e7eb;
      }
      .tab-btn {
        flex: 1;
        height: 44px;
        border: 0;
        border-radius: 0;
        background: transparent;
        color: #64748b;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        border-bottom: 2px solid transparent;
        margin-bottom: -2px;
        transition: color .15s, border-color .15s;
      }
      .tab-btn.active {
        color: var(--primary);
        border-bottom-color: var(--primary);
        font-size: 15px;
      }
      .tab-btn:hover:not(.active) {
        color: #334155;
      }
      .tab-panel { display: none; }
      .tab-panel.active {
        display: block;
        animation: form-fade-in 0.22s ease-out;
      }
      @keyframes form-fade-in {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }
      /* Social buttons */
      .social-buttons {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin: 18px 0 0;
      }
      .social-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        height: 52px;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        background: #fff;
        color: #334155;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background .15s, border-color .15s, box-shadow 0.15s, transform 0.1s;
      }
      .social-btn:hover {
        background: #f8fafc;
        border-color: #cbd5e1;
        box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
      }
      .social-btn:active {
        transform: scale(0.985);
      }
      .divider {
        display: flex;
        align-items: center;
        margin: 26px 0 0;
        color: #9ca3af;
        font-size: 13px;
      }
      .divider::before, .divider::after {
        content: "";
        flex: 1;
        border-bottom: 1px solid #e5e7eb;
      }
      .consent-panel[hidden] { display: none; }
      .consent-panel h2 { margin: 0; color: #0f172a; font-size: 24px; }
      .consent-panel p { color: #64748b; line-height: 1.6; }
      .consent-client {
        margin: 20px 0;
        padding: 16px;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        background: #f8fafc;
      }
      .consent-client strong { display: block; color: #0f172a; font-size: 17px; }
      .consent-client a { color: var(--primary); font-size: 13px; }
      .consent-scopes { margin: 12px 0 22px; padding-left: 20px; color: #334155; }
      .consent-scopes li { margin: 7px 0; }
      .consent-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .consent-deny { border: 1px solid #cbd5e1; background: #fff; color: #334155; }
      .divider span { padding: 0 12px; }
      .forgot-link {
        display: inline-block;
        margin: -8px 0 16px;
        color: var(--primary);
        font-size: 15px;
        text-decoration: none;
        cursor: pointer;
      }
      .forgot-link:hover { text-decoration: underline; }
    </style>
    <style id="custom-style"></style>
  </head>
  <body>
    <div class="split-layout">
      <aside class="brand-panel">
        <div class="brand-inner">
          <div id="brand-mark" class="brand-mark" aria-hidden="true">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none">
              <path d="M12 2.4 L20 5.5 V11.2 C20 16.3 16.4 20.5 12 21.8 C7.6 20.5 4 16.3 4 11.2 V5.5 Z" fill="url(#bm-shield)" stroke="rgba(199,210,254,0.6)" stroke-width="0.7"/>
              <circle cx="12" cy="10.2" r="2" fill="#0b1220"/>
              <path d="M12 12.1 V15.6 M10.7 15.6 H13.3" stroke="#0b1220" stroke-width="1.5" stroke-linecap="round"/>
              <defs>
                <linearGradient id="bm-shield" x1="4" y1="2.4" x2="20" y2="21.8" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#c7d2fe"/>
                  <stop offset="1" stop-color="#818cf8"/>
                </linearGradient>
              </defs>
            </svg>
          </div>
          <img id="logo" class="logo" alt="">
          <h1 id="title">SupaOAuth</h1>
          <p id="subtitle" class="subtitle">Sign in to continue</p>
          <p id="intro" class="intro" style="display:none"></p>
          <div id="brand-illustration" class="brand-illustration" aria-hidden="true"></div>
          <div id="custom-content"></div>
        </div>
      </aside>

      <main class="auth-panel">
        <select id="language" class="language-select" aria-label="Language">
          <option value="en">English</option>
          <option value="zh-CN">中文</option>
        </select>
        <div id="message" class="message"></div>

        <!-- Tabs: sign-in / sign-up / forgot-password -->
        <div id="tabs-nav" class="tabs">
          <button type="button" class="tab-btn active" data-tab="signin" id="tab-signin">Sign In</button>
          <button type="button" class="tab-btn" data-tab="signup" id="tab-signup" style="display:none">Sign Up</button>
          <button type="button" class="tab-btn" data-tab="forgot" id="tab-forgot" style="display:none">Forgot Password</button>
        </div>

        <!-- Sign In panel -->
        <div id="panel-signin" class="tab-panel active">
          <form id="login-form" novalidate>
            <label id="email-label" for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
            <a id="forgot-password-link" class="forgot-link" style="display:none">Forgot password?</a>
            <label id="password-label" for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button id="submit" type="submit">Sign In</button>
          </form>
        </div>

        <!-- Sign Up panel -->
        <div id="panel-signup" class="tab-panel">
          <form id="signup-form">
            <label id="signup-email-label" for="signup-email">Email</label>
            <input id="signup-email" name="email" type="email" autocomplete="email" required>
            <label id="signup-password-label" for="signup-password">Password</label>
            <input id="signup-password" name="password" type="password" autocomplete="new-password" aria-describedby="signup-password-hint" required>
            <p id="signup-password-hint" class="password-hint"></p>
            <button id="signup-submit" type="submit" disabled>Sign Up</button>
          </form>
        </div>

        <!-- Forgot Password panel -->
        <div id="panel-forgot" class="tab-panel">
          <form id="forgot-form">
            <label id="forgot-email-label" for="forgot-email">Email</label>
            <input id="forgot-email" name="email" type="email" autocomplete="email" required>
            <button id="forgot-submit" type="submit">Send Reset Link</button>
          </form>
        </div>

        <!-- Social login buttons -->
        <div id="social-divider" class="divider" style="display:none"><span id="or-text">or</span></div>
        <div id="social-section" class="social-buttons" style="display:none"></div>

        <section id="consent-panel" class="consent-panel" hidden>
          <h2 id="consent-title">Authorize application</h2>
          <p id="consent-description">Review the requested access before continuing.</p>
          <div class="consent-client">
            <strong id="consent-client-name"></strong>
            <a id="consent-client-uri" hidden></a>
          </div>
          <p id="consent-scopes-label">This application requests:</p>
          <ul id="consent-scopes" class="consent-scopes"></ul>
          <div class="consent-actions">
            <button id="consent-deny" type="button" class="consent-deny">Deny</button>
            <button id="consent-approve" type="button">Approve</button>
          </div>
        </section>

        <div id="footer" class="footer">SupaOAuth User Center</div>
      </main>
    </div>

    <script src="/hosted-auth.js"></script>
    <script data-hosted-entry="authorize"></script>
  </body>
</html>
